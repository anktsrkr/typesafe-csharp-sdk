name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Build, test, NativeAOT and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install native compiler prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Verify package
        shell: pwsh
        run: |
          $version = ./eng/Get-PackageVersion.ps1
          ./eng/Verify-Package.ps1 -Version $version
