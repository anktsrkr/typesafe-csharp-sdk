name: Release & Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_beta:
        description: Publish a verified beta package
        type: boolean
        default: true
      version_suffix:
        description: Prerelease label
        type: string
        default: beta
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      pr: ${{ steps.release.outputs.pr }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-ga:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the released commit
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = 'v' + (./eng/Get-PackageVersion.ps1)
          }
          ./eng/Checkout-ReleaseRef.ps1 -Ref $tag
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install native compiler prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Validate and pack the released version
        shell: pwsh
        run: |
          $version = ./eng/Get-PackageVersion.ps1
          ./eng/Verify-Package.ps1 -Version $version
      - name: Publish verified packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'NUGET_API_KEY is required.' }
          foreach ($file in Get-ChildItem artifacts/packages/*.nupkg) {
            dotnet nuget push $file.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw 'NuGet publication failed.' }
            dotnet nuget push $file.FullName --api-key $env:GH_TOKEN --source "https://nuget.pkg.github.com/$($env:PACKAGE_OWNER)/index.json" --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Packages publication failed.' }
          }
          foreach ($file in Get-ChildItem artifacts/packages/* -Include *.nupkg,*.snupkg) {
            gh release upload $env:RELEASE_TAG $file.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ga-packages-${{ github.run_number }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish-beta:
    needs: release-please
    if: ${{ (needs.release-please.outputs.pr != '' && needs.release-please.outputs.pr != 'null') || (github.event_name == 'workflow_dispatch' && inputs.publish_beta) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the beta commit
        shell: pwsh
        env:
          RELEASE_PR: ${{ needs.release-please.outputs.pr }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:RELEASE_PR -and $env:RELEASE_PR -ne 'null') {
            $pr = $env:RELEASE_PR | ConvertFrom-Json
            if ([string]::IsNullOrWhiteSpace($pr.headBranchName)) { throw 'Release PR has no branch.' }
            ./eng/Checkout-ReleaseRef.ps1 -Ref $pr.headBranchName
          } elseif ($env:EVENT_NAME -ne 'workflow_dispatch') {
            throw 'A release PR is required for automatic beta publication.'
          }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install native compiler prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Validate and pack the beta version
        shell: pwsh
        env:
          VERSION_SUFFIX: ${{ inputs.version_suffix || 'beta' }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $suffix = "$($env:VERSION_SUFFIX).$($env:RUN_NUMBER).$($env:RUN_ATTEMPT)"
          $version = ./eng/Get-PackageVersion.ps1 -Suffix $suffix
          ./eng/Verify-Package.ps1 -Version $version -Output artifacts/beta-packages
      - name: Publish verified beta packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          foreach ($file in Get-ChildItem artifacts/beta-packages/*.nupkg) {
            dotnet nuget push $file.FullName --api-key $env:GH_TOKEN --source "https://nuget.pkg.github.com/$($env:PACKAGE_OWNER)/index.json" --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw 'Beta publication failed.' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: beta-packages-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/beta-packages/*
          if-no-files-found: error
